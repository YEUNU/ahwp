name: Release

# 두 가지 trigger 경로:
#   1) Tag push (`git push origin v0.4.29`) — 명시적, 1차 경로.
#   2) Branch push to main — merge / 직접 push 모두 포함. electron-builder
#      의 draft-release semantics 가 idempotent 라 같은 version 재 publish
#      는 기존 draft 를 갱신할 뿐 destructive 하지 않음.
#
# 둘 다 활성화한 이유 — 작업 흐름이 main 머지 (release commit) → tag 푸시
# 두 단계라, 둘 중 어느 쪽이 먼저 도착해도 빌드가 돈다. concurrency 그룹
# 으로 중복 실행은 자연스럽게 직렬화.
on:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  # ref 별로 그룹 — main-push 와 tag-push 가 동시에 트리거돼도
  # 서로 cancel 시키지 않고 순차 실행 (둘 다 같은 산출물을 publish).
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    outputs:
      # 0.6.9 — version 을 job output 으로 노출. publish job 이 checkout
      # 없이 받아서 사용 (matrix 의 마지막 OS 가 set 한 값을 사용 — 모든
      # OS 가 같은 package.json 을 보므로 동일).
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Phase 7 — vendor/rhwp submodule (YEUNU/rhwp 의 ahwp-bridge
          # 브랜치) 가 electron-builder 의 `extraResources` 경유로 packaged
          # 빌드에 동봉. 미초기화 시 rhwp-mode 작동 안 함.
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Read version from package.json
        id: version
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      # electron-builder 의 GitHub publisher 는 default `releaseType: 'draft'`
      # 로 동작 → 세 OS 빌드 모두 같은 Draft 에 asset 업로드 (idempotent).
      # 0.6.4 의 'release' 시도는 immutable-release 정책 충돌로 revert —
      # publish job 이 마지막에 Draft → Published 로 flip.
      - name: Build rhwp-studio (submodule) + ahwp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run vendor:rhwp:build
          npx vite build
          npx electron-builder --publish always

  # 모든 OS 빌드가 성공한 뒤에만 실행 — Draft 에 dmg/setup.exe/AppImage/deb
  # 가 모두 올라온 상태에서 publish 로 flip. `gh release edit` 가
  # `--draft=false --latest` 로 latest 로 표시하면 `latest.yml` 가 공개되어
  # auto-updater 가 인식.
  #
  # 0.6.9 — checkout 제거. 이전 ('publish' job 의 actions/checkout) 이
  # 일부 환경에서 403 으로 fail (token scope / repo 권한 interaction).
  # publish 는 package.json 읽을 필요 없이 build job 의 output 으로 tag
  # 받음. gh CLI 만 호출하면 충분.
  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: success()
    permissions:
      contents: write
    steps:
      - name: Publish Draft → Released (mark as latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::build job did not propagate the tag output"
            exit 1
          fi
          echo "Publishing $TAG …"
          # --draft=false: Draft 해제
          # --latest:      "latest" 표시 + latest.yml 공개 노출
          gh release edit "$TAG" --draft=false --latest --repo "${{ github.repository }}"
